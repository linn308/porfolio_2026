<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="globeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7b869"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- nền bo góc tối, đồng bộ nền site -->
  <rect width="64" height="64" rx="15" fill="#0f0f12"/>

  <!-- quả cầu: viền tròn + 1 kinh tuyến, tô gradient thay vì nét đơn sắc, nét dày hơn để rõ ở size nhỏ -->
  <g fill="none" stroke="url(#globeGrad)" stroke-width="3.4" stroke-linecap="round">
    <circle cx="32" cy="32" r="18"/>
    <ellipse cx="32" cy="32" rx="7.5" ry="18"/>
    <path d="M14.5 32 H49.5"/>
  </g>

  <!-- lấp lánh: 1 tia sáng chính cho nổi bật, khỏi nhạt -->
  <path d="M49 11 L50.6 15 L54.6 16.6 L50.6 18.2 L49 22.2 L47.4 18.2 L43.4 16.6 L47.4 15 Z" fill="#f5f4f2"/>
  <circle cx="14" cy="47" r="2.4" fill="#f5f4f2" opacity="0.85"/>
</svg>
